[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movebank-migracion"
version = "0.1.0"
description = "Analisis local de datos de seguimiento de Movebank"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32", "pandas>=2.2", "numpy>=1.26", "pydantic>=2.8",
  "sqlalchemy>=2.0", "streamlit>=1.38", "plotly>=5.24",
  "folium>=0.17", "geopy>=2.4", "shapely>=2.0", "pyproj>=3.6",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "black>=24", "ruff>=0.6", "mypy>=1.11", "types-requests", "pandas-stubs"]
notebook = ["ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]

[project.scripts]
movebank-load = "movebank.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/movebank --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
include_namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

